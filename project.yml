# Glyph Bot for Mac. Generate the Xcode project with `xcodegen generate`.
name: Studio
options:
  bundleIdPrefix: dev.fru
  deploymentTarget:
    macOS: "26.0"
packages:
  GlyphCore:
    path: Packages/GlyphCore
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Studio: # Glyph Bot on the Mac: the agentic harness over the vault and the Glyph apps
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
        excludes: [Info.plist, Fixtures]
      - path: DemoVault
        type: folder
        buildPhase: resources
    dependencies:
      - package: GlyphCore
        product: GlyphVault
      - package: GlyphCore
        product: GlyphCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fru.studio
        PRODUCT_NAME: Glyph Bot
        PRODUCT_MODULE_NAME: GlyphStudio # the Swift module keeps its name, so the tests' imports stay
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements: # hardened runtime: the mic for talking instead of typing
      path: Mac/Studio.entitlements
      properties:
        com.apple.security.device.audio-input: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Glyph Bot
        NSMicrophoneUsageDescription: Talk to your agents instead of typing. Glyph Bot turns your words into text on this Mac.
        NSSpeechRecognitionUsageDescription: Your words become text on this Mac, never sent anywhere to be transcribed.
        CFBundleName: Glyph Bot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
