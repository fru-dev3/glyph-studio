<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Glyph Studio">
  <!-- Flat dark tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#141416"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lead ascending chevron: solid office green (the dark-surface shade) -->
    <path d="M116 312 L256 176 L396 312" stroke="#2E9E2E" stroke-width="56"/>
    <!-- Echo chevron beneath: solid, darker green -->
    <path d="M156 392 L256 296 L356 392" stroke="#1A5C1A" stroke-width="34"/>
  </g>

  <!-- Guiding star above the apex — solid electric cyan. Lifted clear of the
       chevron tip so it reads as a separate guiding star, not touching it. -->
  <circle cx="256" cy="106" r="22" fill="#3CD8FF"/>
</svg>
